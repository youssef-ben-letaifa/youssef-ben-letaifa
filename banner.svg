<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.headline{font-family:Arial,Helvetica,sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}70%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glowPulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes dotPulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
.ii,.pill,.chip,.card,.soc{opacity:0;transform-box:fill-box;transform-origin:center}
.fadeIn{animation:fadeIn .5s ease forwards}
.popIn{animation:popIn .6s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:left center}
.cur{animation:blink 1s step-end infinite}
.fl{animation:floaty 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.gp{animation:glowPulse 2.6s ease-in-out infinite}
.dp{transform-box:fill-box;transform-origin:center;animation:dotPulse 1.8s ease-in-out infinite}
.sep{stroke:#DCE7FA;stroke-width:1}
]]></style>

